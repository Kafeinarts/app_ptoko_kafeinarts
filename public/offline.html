<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b4332">
    <title>Offline · Kafeinarts POS</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#123327,#1b4332 55%,#2d6a4f);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px}
        .card{max-width:460px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:42px 32px;backdrop-filter:blur(14px);box-shadow:0 25px 60px rgba(0,0,0,.25)}
        .icon{width:86px;height:86px;border-radius:50%;background:rgba(250,237,205,.16);display:grid;place-items:center;margin:0 auto 22px;font-size:38px}
        h1{font-size:1.6rem;margin:0 0 10px}
        p{color:rgba(255,255,255,.72);line-height:1.6;margin:0 0 26px}
        button{border:0;background:#faedcd;color:#1b4332;font-weight:700;padding:14px 26px;border-radius:999px;font-size:1rem;cursor:pointer}
        small{display:block;margin-top:20px;color:rgba(255,255,255,.45)}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/></svg></div>
        <h1>Anda sedang offline</h1>
        <p>Koneksi internet terputus. Halaman yang pernah dibuka tetap bisa diakses, dan transaksi POS akan diantrekan untuk dikirim otomatis saat online kembali.</p>
        <button onclick="location.href='/pos'">Coba Buka Kasir</button>
        <small>Kafeinarts POS · PWA Mode</small>
    </div>
</body>
</html>
